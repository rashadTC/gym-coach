<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gym Coach</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#3552f0">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gym Coach">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: a premium coaching app: confident, warm, fast to use mid-workout.
   IDEA: a training log book that comes alive, with a moving lifter whose working muscles glow.
   PICTURE: the animated lifter (hero card, live workout, exercise sheets) and the front/back muscle map.
   COLOUR and TYPE: cobalt-to-sky brand, coral for working muscles, mint for done; Barlow Condensed (gym plate lettering) + Barlow.
   LAYOUT: iPhone app shell: large title, scrolling cards, bottom tab bar, slide-up sheets, full-screen live mode. */
:root{color-scheme:light dark;--bg:light-dark(#f2f4fa,#0a0d19);--s1:light-dark(#ffffff,#141a2f);--s2:light-dark(#e8ecf7,#1d2442);--ink:light-dark(#0c1124,#f1f3ff);--mute:light-dark(#5d6688,#9aa3c9);--line:light-dark(#dfe4f1,#262f55);--brand:#3552f0;--sky:#21b0ff;--hot:#ff5a36;--hot2:light-dark(#ffd3c6,#5c2b22);--ok:#17b27a;--limb:light-dark(#2b3356,#dde3ff);--torso:light-dark(#3a4470,#c3ccf5);--eq:light-dark(#9aa4c8,#4a5687);--top:env(safe-area-inset-top,0px);--bot:env(safe-area-inset-bottom,0px)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{-webkit-text-size-adjust:100%;margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Barlow,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:"Barlow Condensed",sans-serif;line-height:1.05;margin:0;text-wrap:balance;letter-spacing:.2px}
h1{font-size:40px}h2{font-size:28px}h3{font-size:21px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--hot);outline-offset:2px;border-radius:10px}
#app{max-width:600px;margin:0 auto;min-height:100vh;min-height:100dvh;padding:calc(var(--top) + 14px) 16px calc(var(--bot) + 96px)}
.top{display:flex;align-items:flex-end;gap:12px;margin-bottom:16px}
.top .sub{color:var(--mute);font-weight:600;font-size:15px}
.avatar{margin-left:auto;width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--brand),var(--sky));color:#fff;font:700 19px "Barlow Condensed",sans-serif;flex:none}
.view{animation:fade .25s ease}@keyframes fade{from{opacity:0;transform:translateY(6px)}}
.card{background:var(--s1);border:1px solid var(--line);border-radius:22px;padding:16px;margin-bottom:14px}
.card h3{margin-bottom:10px}
.hero{background:linear-gradient(140deg,var(--brand) 0%,#2a7cf7 60%,var(--sky) 100%);color:#fff;border:0;position:relative;overflow:hidden}
.hero .k{opacity:.85;font-weight:600;font-size:14px}
.hero h2{font-size:34px;margin:4px 0 6px}
.hero .fig{position:absolute;right:-8px;top:8px;width:150px;height:150px;opacity:.95}
.hero .fig .lb{stroke:#fff}.hero .fig .hd{fill:#fff}.hero .fig .sd{fill:#0003}.hero .fig .eq,.hero .fig .eqs{fill:#ffffff55;stroke:#ffffff55}
.hero .body{max-width:62%}
.muted{color:var(--mute)}.small{font-size:14px}.b{font-weight:700}
.row{display:flex;gap:10px;align-items:center}.wrap{flex-wrap:wrap}.sp{margin-left:auto}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:700;border-radius:14px;padding:12px 18px;min-height:46px;background:var(--brand);color:#fff;text-decoration:none}
.btn.w{background:#fff;color:var(--brand)}.btn.g{background:var(--s2);color:var(--ink)}.btn.hot{background:var(--hot)}.btn.ok{background:var(--ok)}
.btn.big{width:100%;min-height:56px;font-size:18px;border-radius:16px}
.btn.sm{min-height:36px;padding:6px 12px;font-size:14px;border-radius:10px}
.chip{display:inline-flex;align-items:center;font-size:13px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--s2);margin:3px 4px 0 0;white-space:nowrap}
.chip.p{background:var(--hot);color:#fff}.hero .chip{background:#ffffff2b;color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.tog{padding:9px 14px;border-radius:99px;background:var(--s1);border:1px solid var(--line);font-weight:600;font-size:15px;min-height:40px}
.tog.on{background:var(--hot);border-color:var(--hot);color:#fff}
.hscroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}.hscroll>*{flex:none}
.seg{display:flex;background:var(--s2);border-radius:14px;padding:4px;margin-bottom:14px}
.seg button{flex:1;padding:10px;border-radius:11px;font-weight:700;color:var(--mute);min-height:42px}
.seg button.on{background:var(--s1);color:var(--ink);box-shadow:0 1px 4px #0002}
.ex{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.ex:first-child{border-top:0}
.thumb{width:62px;height:62px;flex:none;background:var(--s2);border-radius:16px}
.ex .nm{font-weight:700;line-height:1.2}.ex .arrow{margin-left:auto;color:var(--mute);font-size:22px;flex:none}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--s2);border-radius:16px;padding:12px}
.stat b{display:block;font:700 30px/1 "Barlow Condensed",sans-serif;margin-bottom:4px}
.stat span{font-size:13px;color:var(--mute);font-weight:600}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;text-align:center;font-size:12px;font-weight:600;color:var(--mute)}
.week i{display:grid;place-items:center;margin:4px auto 0;width:34px;height:34px;border-radius:50%;background:var(--s2);font-style:normal;color:var(--ink);font-size:14px}
.week i.on{background:var(--ok);color:#fff}.week i.td{outline:2px solid var(--brand)}
.coach{display:flex;gap:12px;align-items:flex-start}
.coach .ic{width:40px;height:40px;border-radius:12px;background:var(--hot2);display:grid;place-items:center;flex:none;font-size:20px}
.note{background:var(--s2);border-radius:14px;padding:11px 13px;font-size:15px;margin-top:10px}
.note.hot{background:var(--hot2)}
.tick{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:11px 0;border-top:1px solid var(--line);font-weight:500}
.tick:first-child{border-top:0}
.tick .bx{width:28px;height:28px;border-radius:9px;border:2px solid var(--line);display:grid;place-items:center;flex:none;color:#fff;font-weight:700}
.tick.on .bx{background:var(--ok);border-color:var(--ok)}.tick.on .tx{color:var(--mute);text-decoration:line-through}
input,select{font:16px Barlow,sans-serif;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--s2);color:var(--ink);min-height:46px;width:100%}
label.l{display:block;font-size:14px;color:var(--mute);font-weight:600;margin:0 0 4px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.bars .r{display:grid;grid-template-columns:7.5em minmax(0,1fr) 3em;gap:8px;align-items:center;font-size:14px;margin:7px 0}
.bars .t{height:12px;border-radius:6px;background:var(--s2);position:relative;overflow:hidden}
.bars .t i{position:absolute;inset:0 auto 0 0;border-radius:6px;background:var(--brand)}
.bars .t i.lo{background:var(--eq)}.bars .t i.hi{background:var(--ok)}
.bars .n{text-align:right;font-weight:700;white-space:nowrap}
.cols{display:flex;align-items:flex-end;gap:8px;height:120px;padding-top:10px}
.cols div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--mute);height:100%;justify-content:flex-end}
.cols b{width:100%;border-radius:8px 8px 4px 4px;background:var(--brand);min-height:4px}
.cols b.cur{background:var(--hot)}
.fig2{position:relative;height:190px}.fig2>svg{position:absolute;inset:0;width:100%;height:100%}
.ach{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.ach div{background:var(--s2);border-radius:16px;padding:10px;text-align:center;font-size:13px;font-weight:600;opacity:.45}
.ach div.on{opacity:1;background:linear-gradient(140deg,var(--brand),var(--sky));color:#fff}
.ach em{display:block;font-style:normal;font-size:26px}
table{width:100%;border-collapse:collapse;font-size:15px}td{padding:9px 2px;border-top:1px solid var(--line)}td.n{text-align:right;white-space:nowrap;font-weight:700}
/* tab bar */
.tabbar{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(600px,100%);display:grid;grid-template-columns:repeat(5,1fr);background:color-mix(in srgb,var(--s1) 88%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:6px 6px calc(var(--bot) + 6px);z-index:10}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:600;color:var(--mute);padding:6px 0;min-height:50px;border-radius:12px}
.tabbar button.on{color:var(--brand)}
.tabbar svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* sheet */
#back{position:fixed;inset:0;background:#0009;z-index:48;opacity:0;pointer-events:none;transition:opacity .25s}
#back.open{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:50%;bottom:0;width:min(600px,100%);max-height:92vh;max-height:calc(100dvh - var(--top) - 12px);overflow:auto;background:var(--s1);border-radius:26px 26px 0 0;z-index:49;transform:translate(-50%,105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);padding:10px 16px calc(var(--bot) + 24px)}
#sheet.open{transform:translate(-50%,0)}
.grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 10px}
.demo{background:var(--s2);border-radius:20px;padding:6px;margin:12px 0}
.demo svg{width:100%;height:auto;display:block}
.pair{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:10px}
/* figure */
.lb{stroke:var(--limb);stroke-linecap:round;fill:none}.lb.t{stroke:var(--torso)}
.lb.hot{stroke:var(--hot);filter:drop-shadow(0 0 5px #ff5a3699)}.hotc{fill:var(--hot);filter:drop-shadow(0 0 5px #ff5a3699)}
.hd{fill:var(--limb)}.sd{fill:#0002}.fl{stroke:var(--eq);stroke-width:2}
.eq{fill:var(--eq)}.eqs{fill:none;stroke:var(--eq);stroke-width:8;stroke-linecap:round}
.plate{fill:var(--brand)}.hub{fill:var(--s1)}
.m{fill:var(--s1);stroke:var(--line);stroke-width:.8}.m.p{fill:var(--hot)}.m.s{fill:var(--hot2)}.bd{fill:var(--line)}
.mm text{fill:var(--mute);font:600 11px Barlow,sans-serif}
/* live */
#live{position:fixed;inset:0;background:var(--bg);z-index:40;overflow:auto;display:none;padding:calc(var(--top) + 10px) 16px calc(var(--bot) + 110px)}
#live.open{display:block;animation:up .3s cubic-bezier(.2,.8,.2,1)}@keyframes up{from{transform:translateY(40px);opacity:0}}
#live .in{max-width:600px;margin:0 auto}
.lvtop{display:flex;align-items:center;gap:10px}
.lvtop .ib{width:44px;height:44px;border-radius:14px;background:var(--s2);font-size:20px;flex:none}
.lvtop .mid{flex:1;text-align:center}.lvtop .mid b{display:block;font-size:15px}
.clock{font:700 22px "Barlow Condensed",sans-serif;color:var(--brand)}
.prog{display:flex;gap:4px;margin:12px 0 16px}.prog i{flex:1;height:5px;border-radius:3px;background:var(--s2)}.prog i.d{background:var(--ok)}.prog i.c{background:var(--brand)}
.lvfig{background:var(--s1);border:1px solid var(--line);border-radius:24px;padding:4px}
.lvfig svg{width:100%;height:auto;display:block;max-height:36vh;max-height:34dvh}
.sets{margin-top:12px}
.setr{display:grid;grid-template-columns:2.2em minmax(0,1fr) minmax(0,1fr) 48px;gap:8px;align-items:center;padding:8px;border-radius:16px;margin-top:6px}
.setr.cur{background:var(--s1);border:1px solid var(--brand)}
.setr.dn{opacity:.6}
.step{display:flex;align-items:center;background:var(--s2);border-radius:12px;min-height:46px}
.step button{width:38px;height:46px;font-size:22px;font-weight:700;color:var(--brand);flex:none}
.step span{flex:1;text-align:center;font-weight:700;font-size:17px;white-space:nowrap}
.step small{font-size:11px;color:var(--mute);font-weight:600}
.done{width:46px;height:46px;border-radius:14px;background:var(--s2);font-size:20px;font-weight:700}
.done.on{background:var(--ok);color:#fff}
.lvbar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(600px,100%);padding:12px 16px calc(var(--bot) + 14px);background:linear-gradient(transparent,var(--bg) 30%);z-index:41}
#rest{position:fixed;inset:0;z-index:45;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(8px);display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:20px;text-align:center}
#rest.open{display:flex}
.ring{width:230px;height:230px;position:relative}.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font:700 58px "Barlow Condensed",sans-serif}
.ring circle{fill:none;stroke-width:14}.ring .bgc{stroke:var(--s2)}.ring .fgc{stroke:var(--brand);stroke-linecap:round;transition:stroke-dashoffset 1s linear}
/* onboarding */
#onb{position:fixed;inset:0;z-index:60;background:var(--bg);display:none;overflow:auto;padding:calc(var(--top) + 18px) 20px calc(var(--bot) + 24px)}
#onb.open{display:block}
#onb .in{max-width:520px;margin:0 auto;min-height:calc(100vh - 60px);min-height:calc(100dvh - var(--top) - var(--bot) - 42px);display:flex;flex-direction:column}
.dots{display:flex;gap:6px;margin-bottom:24px}.dots i{flex:1;height:5px;border-radius:3px;background:var(--s2)}.dots i.on{background:var(--brand)}
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--s1);border:2px solid var(--line);border-radius:18px;padding:14px;margin-bottom:10px}
.opt.on{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 10%,var(--s1))}
.opt em{font-style:normal;font-size:26px;width:44px;height:44px;border-radius:14px;background:var(--s2);display:grid;place-items:center;flex:none}
.opt b{display:block}.opt span{color:var(--mute);font-size:14px}
.big-in{font:700 40px "Barlow Condensed",sans-serif;text-align:center;min-height:70px}
.onbnav{margin-top:auto;padding:16px 0 4px;display:flex;gap:10px;position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 22%)}
#toast{position:fixed;left:50%;top:calc(var(--top) + 12px);transform:translate(-50%,-30px);opacity:0;visibility:hidden;pointer-events:none;background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:14px;z-index:80;font-weight:600;transition:transform .3s,opacity .3s,visibility .3s;max-width:90vw;text-align:center}
#toast.on{transform:translate(-50%,0);opacity:1;visibility:visible}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden}
.confetti i{position:absolute;top:-10px;width:9px;height:14px;border-radius:2px;animation:fall 2.6s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}
/* v4 */
.mrow{padding:6px 0}.mrow .bx{cursor:pointer}.mrow .mname{flex:1;text-align:left;min-height:44px;padding:4px 0}.mrow.sel{background:color-mix(in srgb,var(--brand) 9%,transparent);border-radius:12px;padding-left:6px;margin-inline:-6px}
.week i.pl{box-shadow:inset 0 0 0 2px var(--eq)}.week i.ms{color:var(--hot)}
.plates{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:13px;color:var(--mute);font-weight:600;margin:6px 0 0 2.6em}
.pc{display:inline-grid;place-items:center;min-width:30px;height:24px;padding:0 6px;border-radius:6px;font-weight:700;font-size:12px;color:#fff}
.p25{background:#e53935}.p20{background:#1e5bd8}.p15{background:#f2c200;color:#222}.p10{background:#2e9d55}.p5{background:#f4f4f4;color:#222;box-shadow:inset 0 0 0 1px #bbb}.p2{background:#333}.p1{background:#9aa0a6}
.wu{background:var(--s1);border:1px dashed var(--line);border-radius:16px;padding:10px 12px;margin-top:12px}
.wu .r{display:flex;align-items:center;gap:10px;padding:6px 0;border-top:1px solid var(--line)}.wu .r:first-of-type{border-top:0}
.wu .r .done{width:40px;height:40px}
.feel{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
.feel button{background:var(--s2);border-radius:16px;padding:12px 6px;font-weight:700;border:2px solid transparent}
.feel button em{display:block;font-style:normal;font-size:28px}
.feel button.on{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 14%,var(--s1))}
.dayp{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.dayp button{min-height:52px;border-radius:14px;background:var(--s2);font-weight:700;border:2px solid transparent}
.dayp button.on{background:var(--brand);color:#fff}
/* tutorial player */
#tut{position:fixed;inset:0;z-index:75;background:#070a14;color:#eef1ff;display:none;overflow:auto;padding:calc(var(--top) + 10px) 14px calc(var(--bot) + 18px)}
#tut.open{display:block;animation:up .3s cubic-bezier(.2,.8,.2,1)}
#tut .in{max-width:640px;margin:0 auto}
#tut .ib{width:44px;height:44px;border-radius:14px;background:#ffffff14;font-size:19px;color:#fff;flex:none}
#tut .mid{flex:1;text-align:center}#tut .mid b{display:block}#tut .mid span{font-size:13px;color:#9aa3c9;font-weight:600}
.stage{position:relative;margin-top:12px;border-radius:24px;overflow:hidden;background:radial-gradient(120% 90% at 50% 15%,#22306a 0%,#0e1430 55%,#090c1b 100%);aspect-ratio:1/1;max-height:58vh;width:100%}
.stage::after{content:"";position:absolute;inset:auto 0 0 0;height:22%;background:repeating-linear-gradient(90deg,#ffffff08 0 1px,transparent 1px 28px),linear-gradient(transparent,#ffffff0a);pointer-events:none}
.stage>svg{position:absolute;inset:6% 6% 4%;width:88%;height:90%}
.stage .lb{stroke:#e8ecff}.stage .lb.t{stroke:#b9c3f2}.stage .hd{fill:#e8ecff}.stage .fl{stroke:#ffffff40}.stage .sd{fill:#0006}.stage .eq,.stage .eqs{fill:#59649a;stroke:#59649a}.stage .plate{fill:#4f6bff}.stage .hub{fill:#0e1430}
#tutMap{position:absolute;inset:8%;display:none}#tutMap svg{width:100%;height:100%}#tutMap .m{fill:#1b2450;stroke:#2c3772}#tutMap .bd{fill:#2c3772}#tutMap .m.s{fill:#7a3a2c}#tutMap .m.p{fill:var(--hot);filter:drop-shadow(0 0 6px #ff5a36aa)}#tutMap text{fill:#9aa3c9}
.tchip{position:absolute;left:12px;top:12px;background:#0009;backdrop-filter:blur(6px);padding:6px 12px;border-radius:99px;font-weight:700;font-size:14px}
.tbadge{position:absolute;right:12px;top:12px;padding:6px 12px;border-radius:99px;font-weight:700;font-size:14px;display:none}
.tbadge.bad{display:block;background:#ff3b30}.tbadge.good{display:block;background:var(--ok)}
.ttempo{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);font:700 22px "Barlow Condensed",sans-serif;letter-spacing:.5px;background:#0008;padding:4px 14px;border-radius:12px;white-space:nowrap;display:none}
.trep{position:absolute;right:14px;bottom:12px;font:700 44px/1 "Barlow Condensed",sans-serif;color:#ffffffcc;display:none}
.tsegs{display:flex;gap:4px;margin:14px 0 6px}.tsegs button{height:22px;position:relative;flex:1}.tsegs button i{position:absolute;left:0;right:0;top:9px;height:5px;border-radius:3px;background:#ffffff22;overflow:hidden}.tsegs button i b{position:absolute;inset:0 auto 0 0;background:#fff;border-radius:3px}
.tcap{min-height:4.8em;font-size:18px;line-height:1.4;margin:8px 2px 4px;font-weight:500}.tcap b{color:#ff8a6b}
.tctl{display:flex;justify-content:center;align-items:center;gap:18px;margin-top:6px}
.tctl button{width:56px;height:56px;border-radius:50%;background:#ffffff14;color:#fff;font-size:22px}
.tctl button.pl{width:74px;height:74px;background:#fff;color:#0a0d19;font-size:28px}
.tut-btn{background:linear-gradient(135deg,var(--brand),var(--sky))}

 if(k==null){const L=S.logs[0];k=L&&!L.watch&&(Date.now()-new Date(L.d))<6*36e5?0:-1}
 if(k>=0&&S.logs[k]){S.logs[k].watch=w;if(!S.logs[k].min&&w.min)S.logs[k].min=w.min}
 else{S.logs.unshift({d:new Date().toISOString(),n:'Apple Watch workout',src:'watch',items:[],mob:false,end:true,min:w.min||0,watch:w});k=0}
 if(summary&&k===0)summary.log=S.logs[0];
 save();render();toast(`⌚ Saved: ❤️ ${w.hr||'–'} bpm · 🔥 ${w.kcal||0} kcal`);return k}
function hrZone(hr){const mx=220-num(S.profile.age||30),p=hr/mx;return p<.6?['Zone 1','easy recovery']:p<.7?['Zone 2','fat-burning base']:p<.8?['Zone 3','aerobic fitness']:p<.9?['Zone 4','threshold, hard']:['Zone 5','max effort']}
const watchLine=w=>w?`❤️ ${w.hr||'–'} avg${w.max?` · ${w.max} max`:''} bpm · 🔥 ${w.kcal||0} kcal`:'';

 openSheet(`<div class="row"><div><div class="muted small b">${L?esc(L.n):'Apple Watch'}</div><h2>Add Apple Watch data</h2></div><button class="btn g sm sp" data-act="closeSheet" aria-label="Close">✕</button></div>

let restLeft=0,restTotal=0,restT=0,clockT=0,endT=0,endLeft=0,endTotal=0,endRun=false,summary=null,actx=null;
function beep(n){if(!S.set.sound)return;try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();for(let k=0;k<(n||1);k++){const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=880;o.connect(g);g.connect(actx.destination);const t=actx.currentTime+k*.25;g.gain.setValueAtTime(.25,t);g.gain.exponentialRampToValueAtTime(.001,t+.2);o.start(t);o.stop(t+.21)}}catch(e){}try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}}
function startWorkout(name,items,end,src){
 if(S.active&&S.active.items.some(i=>Object.values(S.active.sets[i.id]||[]).some(s=>s.d))&&!confirmStart){confirmStart=true;toast('You have a workout in progress. Tap again to replace it.');setTimeout(()=>confirmStart=false,4000);return}
 confirmStart=false;
 const sets={};items.forEach(i=>{const g=suggest(i.id,i.lo,i.hi);sets[i.id]=Array.from({length:i.s},()=>({w:g.w||0,r:EX[i.id].u==='s'?i.lo:i.hi,d:false}))});
 S.active={name,items,end,src,sets,mob:[],endDone:false,step:0,started:Date.now()};
 save();closeSheet();try{actx=actx||new (window.AudioContext||window.webkitAudioContext)()}catch(e){}render();
}
let confirmStart=false;

 }else if(k<=A.items.length){

let T=null;

function tutSpeak(txt){try{if(!('speechSynthesis' in window))return;speechSynthesis.cancel();if(!S.set.voice||!T||!T.play)return;const u=new SpeechSynthesisUtterance(txt);u.rate=1;u.pitch=1;u.lang='en-US';speechSynthesis.speak(u)}catch(e){}}
function tutAt(t){let a=0;for(let i=0;i<T.ch.length;i++){if(t<a+T.ch[i].d)return{i,lt:t-a};a+=T.ch[i].d}return{i:T.ch.length-1,lt:T.ch[T.ch.length-1].d}}
function tutFrame(now){
 if(!T)return;
 const dt=Math.min(.1,(now-T.last)/1000);T.last=now;if(T.play)T.t=Math.min(T.tot,T.t+dt);
 const {i,lt}=tutAt(T.t),c=T.ch[i],x=T.x,P=PAT[x.p];
 if(i!==T.cur){T.cur=i;$('#tutCh').textContent=`${i+1}/${T.ch.length} · ${c.k}`;
  $('#tutCap').innerHTML=c.mode==='mistake'?`<b>✗ ${esc(c.w.charAt(0).toUpperCase()+c.w.slice(1))}</b><br>✓ ${esc(c.fx.charAt(0).toUpperCase()+c.fx.slice(1))}.`:esc(c.say);
  $('#tutMap').style.display=c.mode==='map'?'block':'none';$('#tutSvg').style.display=c.mode==='map'?'none':'block';
  tutSpeak(c.say)}
 // figure pose
 let f=.65,q;const ms=lt*1000;
 let badge='',tempo='',rep='';
 if(c.mode==='hold')f=c.f;
 if(c.mode==='move'){f=RM?.7:phaseFor(x.p,ms*c.rate);if(c.tempo){const cyc=(ms*c.rate%3400)/3400,ecc=ECC.has(x.p),out=ecc?(cyc>=.12&&cyc<.55):(cyc>=.45);tempo=cyc<.12?'Brace':out?'Control ↓ 2 s':(ecc?cyc>=.65:(cyc<.35))?'Drive ⚡':'Squeeze'}if(c.count)rep=String(Math.floor(ms*c.rate/3400)+1)}
 let lean=0;
 if(c.mode==='mistake'){const half=c.d/2,wrong=lt<half&&c.m!=='none';badge=lt<half?'bad':'good';
  if(wrong){if(c.m==='partial')f=phaseFor(x.p,ms)*.42;else if(c.m==='fast')f=phaseFor(x.p,ms*2.6);else{f=phaseFor(x.p,ms*.8);lean=x.p==='ohp'?-16:c.m==='sag'?-9:18}}
  else f=phaseFor(x.p,(lt-(c.m==='none'?0:half))*1000);
  $('#tutBadge').textContent=lt<half?(c.m==='none'?'⚠ Avoid this':'✗ Wrong'):'✓ Right'}
 $('#tutBadge').className='tbadge '+badge;
 const te=$('#tutTempo');te.style.display=tempo?'block':'none';te.textContent=tempo;
 const rp=$('#tutRep');rp.style.display=rep?'block':'none';rp.textContent=rep;
 if(c.mode!=='map'&&P){q=lerp(P[0],P[1],f);if(x.prop)q.prop=x.prop==='none'?null:x.prop;if(lean){q.t+=lean;if(c.m==='sag'){q.th-=lean}}$('#tutSvg').innerHTML=fig(q,x.pri)}
 // progress
 let a=0;document.querySelectorAll('#tutSegs b').forEach((b,j)=>{const d=T.ch[j].d;b.style.width=(T.t>=a+d?100:T.t<=a?0:(T.t-a)/d*100)+'%';a+=d});
 $('#tutTime').textContent=`Video tutorial · ${fmt(T.t)} / ${fmt(T.tot)}`;
 if(T.t>=T.tot&&T.play){T.play=false;$('#tutPlayB').textContent='↻';$('#tutCap').innerHTML='That\'s it! Tap <b>↻</b> to replay, or ✕ to get training.';try{speechSynthesis.cancel()}catch(e){}}
 T.raf=requestAnimationFrame(tutFrame);
}

 feel:a=>{const A=A_(),it=A.items[A.step-1];A.feel=A.feel||{};A.feel[it.id]=a;save();renderLive();toast(a==='easy'?'Noted: more weight next time 💪':a==='hard'?'Noted: we\'ll hold this weight next time':'Perfect: steady progress')},
 liveSwap:()=>{const A=A_(),it=A.items[A.step-1],x=EX[it.id],used=new Set(A.items.map(i=>i.id)),ok=e=>EQOK[S.profile.eq||'gym'].includes(e);
  const alts=Object.keys(EX).filter(k=>!used.has(k)&&EX[k].pri.some(m=>x.pri.includes(m))).sort((a,b)=>(EX[b].pri[0]===x.pri[0])-(EX[a].pri[0]===x.pri[0])||ok(EX[b].eq)-ok(EX[a].eq));
